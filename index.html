<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ITSM Incident Dashboard – SLA Tracker</title>
<meta name="description" content="ServiceNow-style incident management dashboard: impact × urgency priority matrix, live SLA timers, filters and charts. Vanilla JS.">
<style>
:root{--bg:#F3F5F8;--panel:#fff;--ink:#16202B;--muted:#64748B;--line:#E2E8F0;--brand:#1F6FEB;--p1:#DC2626;--p2:#EA580C;--p3:#CA8A04;--p4:#2563EB;--p5:#64748B;--ok:#16A34A}
[data-theme=dark]{--bg:#0B1220;--panel:#111A2B;--ink:#E5EDF7;--muted:#94A3B8;--line:#1F2A3D}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#0F1B2D;color:#fff;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{font-size:1rem;font-weight:700;display:flex;gap:10px;align-items:center}
header h1 span{background:var(--brand);width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
header .r{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px}
header button{background:#1E2D45;border-color:#2A3B57;color:#fff}
.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
main{padding:20px;max-width:1300px;margin:0 auto;display:grid;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{color:var(--muted);font-size:.8rem}
.kpi .v{font-size:1.7rem;font-weight:800;margin-top:4px}
.kpi.warn .v{color:var(--p2)}.kpi.bad .v{color:var(--p1)}.kpi.good .v{color:var(--ok)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{font-size:.95rem;margin-bottom:12px}
.bars .b{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;margin:8px 0;font-size:.85rem}
.track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .4s}
.matrix{display:grid;grid-template-columns:90px repeat(3,1fr);gap:6px;font-size:.8rem;text-align:center}
.matrix div{padding:10px 4px;border-radius:8px}
.matrix .h{color:var(--muted);font-weight:600;background:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select,.modal input,.modal select,.modal textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.toolbar input{flex:1;min-width:180px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}
tr:hover td{background:color-mix(in srgb,var(--brand) 5%,transparent)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:700;color:#fff}
.st{font-size:.78rem;padding:2px 8px;border-radius:6px;background:var(--line)}
.sla{min-width:150px}
.sla .t{font-size:.78rem;font-variant-numeric:tabular-nums}
.sla .track{height:6px;margin-top:4px}
.breach{color:var(--p1);font-weight:700}
.act button{padding:4px 8px;font-size:.78rem}
.empty{text-align:center;color:var(--muted);padding:30px}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:50;padding:16px}
.modal.open{display:grid}
.modal form{background:var(--panel);border-radius:14px;padding:22px;width:min(520px,100%);display:grid;gap:12px}
.modal label{display:grid;gap:4px;font-size:.82rem;font-weight:600}
.modal .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{font-size:.85rem;color:var(--muted)}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}.hide-m{display:none}}
</style>
</head>
<body>
<header>
  <h1><span>⚡</span>ITSM Incident Dashboard</h1>
  <div class="r"><button id="theme">🌙</button><button id="reset">Reset demo data</button><button class="primary" id="new">+ New incident</button></div>
</header>
<main>
  <section class="kpis" id="kpis"></section>
  <section class="row2">
    <div class="panel"><h2>Open incidents by priority</h2><div class="bars" id="bars"></div></div>
    <div class="panel"><h2>Priority matrix (Impact × Urgency)</h2><div class="matrix" id="matrix"></div>
      <p class="calc" style="margin-top:10px">Priority is calculated the same way as the ServiceNow default data lookup: 1-High, 2-Medium, 3-Low for both impact and urgency.</p></div>
  </section>
  <section class="panel">
    <div class="toolbar">
      <input id="q" placeholder="Search number, short description, caller or group…">
      <select id="fState"><option value="">All states</option><option>New</option><option>In Progress</option><option>On Hold</option><option>Resolved</option></select>
      <select id="fPri"><option value="">All priorities</option><option value="1">P1 – Critical</option><option value="2">P2 – High</option><option value="3">P3 – Moderate</option><option value="4">P4 – Low</option><option value="5">P5 – Planning</option></select>
      <select id="fGroup"><option value="">All groups</option></select>
      <button id="export">Export CSV</button>
    </div>
    <table>
      <thead><tr><th data-k="number">Number</th><th data-k="short">Short description</th><th data-k="priority">Priority</th><th data-k="state">State</th><th class="hide-m" data-k="group">Assignment group</th><th data-k="sla">Resolution SLA</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>

<div class="modal" id="modal"><form id="form">
  <h2 style="font-size:1.05rem">New incident</h2>
  <label>Short description<input id="fShort" required maxlength="90" placeholder="e.g. Email not syncing on mobile"></label>
  <div class="g2"><label>Caller<input id="fCaller" required placeholder="Full name"></label>
  <label>Category<select id="fCat"><option>Network</option><option>Software</option><option>Hardware</option><option>Access</option><option>Database</option></select></label></div>
  <div class="g2"><label>Impact<select id="fImpact"><option value="1">1 - High</option><option value="2" selected>2 - Medium</option><option value="3">3 - Low</option></select></label>
  <label>Urgency<select id="fUrg"><option value="1">1 - High</option><option value="2" selected>2 - Medium</option><option value="3">3 - Low</option></select></label></div>
  <label>Assignment group<select id="fAssign"></select></label>
  <div class="calc" id="calc"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" id="cancel">Cancel</button><button class="primary">Create</button></div>
</form></div>

<script>
// Priority lookup = ServiceNow default (impact x urgency)
const PRI = {"1,1":1,"1,2":2,"1,3":3,"2,1":2,"2,2":3,"2,3":4,"3,1":3,"3,2":4,"3,3":5};
const PNAME = {1:"Critical",2:"High",3:"Moderate",4:"Low",5:"Planning"};
const PCOL = {1:"var(--p1)",2:"var(--p2)",3:"var(--p3)",4:"var(--p4)",5:"var(--p5)"};
const SLA_H = {1:4,2:8,3:24,4:72,5:120}; // resolution target in hours
const GROUPS = ["Service Desk","Network","Database","Application Support","Hardware","Identity & Access"];
const KEY = "itsm-dashboard-v1";
const $ = s => document.querySelector(s);
const H = 3600e3;

function seed(){
  const now=Date.now(), d=[
    ["Core switch down in Pune DC – no network on floor 3","Network","Network",1,1,"In Progress",-2.5],
    ["Payroll application throwing 500 error","Application Support","Software",1,2,"New",-1],
    ["VPN disconnecting every 10 minutes","Network","Network",2,1,"In Progress",-9],
    ["Unable to reset password for new joiner","Identity & Access","Access",2,1,"On Hold",-10],
    ["Laptop battery swelling – replace device","Hardware","Hardware",2,2,"New",-3],
    ["Report query running slow on CMDB","Database","Database",3,2,"In Progress",-30],
    ["Outlook signature not updating","Service Desk","Software",3,3,"New",-20],
    ["Printer on 2nd floor shows paper jam","Hardware","Hardware",3,2,"Resolved",-26],
    ["Shared mailbox not receiving mail","Application Support","Software",2,1,"Resolved",-20],
    ["Request access to shared drive","Identity & Access","Access",3,1,"In Progress",-5],
    ["Website login page loads slowly","Application Support","Software",2,2,"In Progress",-9],
    ["Database backup job failed overnight","Database","Database",1,2,"New",-0.5],
    ["Monitor flickering at reception desk","Hardware","Hardware",3,3,"On Hold",-60]
  ];
  const callers=["Priya Shah","Rahul Verma","Anita Rao","Karan Mehta","Sneha Patil","Arjun Nair"];
  return d.map((r,i)=>({number:"INC00"+(10021+i),short:r[0],group:r[1],category:r[2],impact:r[3],urgency:r[4],priority:PRI[r[3]+","+r[4]],state:r[5],caller:callers[i%callers.length],opened:now+r[6]*H,resolved:r[5]==="Resolved"?now+(r[6]+5)*H:null}));
}
let data; try{ data=JSON.parse(localStorage.getItem(KEY))||seed(); }catch(e){ data=seed(); }
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} };
let sortK="sla", sortDir=1;

function sla(inc){
  const target=inc.opened+SLA_H[inc.priority]*H, end=inc.resolved||Date.now();
  const used=(end-inc.opened)/(SLA_H[inc.priority]*H);
  return {target, left:target-end, pct:Math.min(used,1), breached:end>target};
}
function dur(ms){ const neg=ms<0; ms=Math.abs(ms); const h=Math.floor(ms/H), m=Math.floor(ms%H/60e3); return (neg?"-":"")+(h?h+"h ":"")+m+"m"; }

function render(){
  const open=data.filter(i=>i.state!=="Resolved");
  const breached=open.filter(i=>sla(i).breached).length;
  const atRisk=open.filter(i=>{const s=sla(i);return !s.breached&&s.pct>=.75}).length;
  const res=data.filter(i=>i.state==="Resolved");
  const met=res.length?Math.round(100*res.filter(i=>!sla(i).breached).length/res.length):100;
  $("#kpis").innerHTML=[["Open incidents",open.length,""],["P1 critical open",open.filter(i=>i.priority===1).length,open.some(i=>i.priority===1)?"bad":""],["SLA breached",breached,breached?"bad":"good"],["At risk (>75% SLA used)",atRisk,atRisk?"warn":""],["SLA met (resolved)",met+"%",met>=90?"good":"warn"]]
    .map(([l,v,c])=>`<div class="kpi ${c}"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
  const max=Math.max(1,...[1,2,3,4,5].map(p=>open.filter(i=>i.priority===p).length));
  $("#bars").innerHTML=[1,2,3,4,5].map(p=>{const n=open.filter(i=>i.priority===p).length;return `<div class="b"><span>P${p} – ${PNAME[p]}</span><div class="track"><div class="fill" style="width:${n/max*100}%;background:${PCOL[p]}"></div></div><b>${n}</b></div>`}).join("");
  let m='<div class="h"></div><div class="h">Urgency 1</div><div class="h">Urgency 2</div><div class="h">Urgency 3</div>';
  for(let im=1;im<=3;im++){ m+=`<div class="h">Impact ${im}</div>`; for(let u=1;u<=3;u++){ const p=PRI[im+","+u], n=open.filter(i=>i.impact===im&&i.urgency===u).length; m+=`<div style="background:${PCOL[p]};color:#fff;opacity:${n?1:.45}">P${p}<br><b>${n}</b></div>`; } }
  $("#matrix").innerHTML=m;

  const q=$("#q").value.toLowerCase(), fs=$("#fState").value, fp=$("#fPri").value, fg=$("#fGroup").value;
  let rows=data.filter(i=>(!q||[i.number,i.short,i.caller,i.group].join(" ").toLowerCase().includes(q))&&(!fs||i.state===fs)&&(!fp||i.priority==fp)&&(!fg||i.group===fg));
  rows.sort((a,b)=>{ let x,y; if(sortK==="sla"){x=a.state==="Resolved"?1e15:sla(a).left;y=b.state==="Resolved"?1e15:sla(b).left;} else {x=a[sortK];y=b[sortK];} return (x>y?1:x<y?-1:0)*sortDir; });
  $("#rows").innerHTML=rows.length?rows.map(i=>{ const s=sla(i);
    const col=s.breached?"var(--p1)":s.pct>=.75?"var(--p2)":"var(--ok)";
    const t=i.state==="Resolved"?(s.breached?'<span class="breach">Resolved – breached</span>':'Resolved within SLA'):(s.breached?`<span class="breach">Breached ${dur(-s.left)} ago</span>`:`${dur(s.left)} left`);
    return `<tr><td><b>${i.number}</b></td><td>${esc(i.short)}<div style="color:var(--muted);font-size:.78rem">${esc(i.caller)} · ${i.category}</div></td>
    <td><span class="pill" style="background:${PCOL[i.priority]}">P${i.priority}</span></td><td><span class="st">${i.state}</span></td><td class="hide-m">${i.group}</td>
    <td class="sla"><div class="t">${t}</div><div class="track"><div class="fill" style="width:${s.pct*100}%;background:${col}"></div></div></td>
    <td class="act">${i.state!=="Resolved"?`<button data-a="next" data-n="${i.number}">${i.state==="New"?"Start":"Resolve"}</button>`:""}</td></tr>`}).join(""):'<tr><td colspan="7" class="empty">No incidents match your filters.</td></tr>';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("#rows").addEventListener("click",e=>{ const b=e.target.closest("button[data-a]"); if(!b) return; const i=data.find(x=>x.number===b.dataset.n);
  if(i.state==="New"||i.state==="On Hold") i.state="In Progress"; else { i.state="Resolved"; i.resolved=Date.now(); } save(); render(); });
document.querySelectorAll("th[data-k]").forEach(th=>th.addEventListener("click",()=>{ const k=th.dataset.k; sortDir=sortK===k?-sortDir:1; sortK=k; render(); }));
["#q","#fState","#fPri","#fGroup"].forEach(s=>$(s).addEventListener("input",render));
$("#fGroup").innerHTML+=GROUPS.map(g=>`<option>${g}</option>`).join("");
$("#fAssign").innerHTML=GROUPS.map(g=>`<option>${g}</option>`).join("");

const upd=()=>{ const p=PRI[$("#fImpact").value+","+$("#fUrg").value]; $("#calc").innerHTML=`Calculated priority: <b style="color:${PCOL[p]}">P${p} – ${PNAME[p]}</b> · Resolution SLA: ${SLA_H[p]} hours`; };
$("#fImpact").onchange=upd; $("#fUrg").onchange=upd;
$("#new").onclick=()=>{ $("#form").reset(); upd(); $("#modal").classList.add("open"); $("#fShort").focus(); };
$("#cancel").onclick=()=>$("#modal").classList.remove("open");
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") $("#modal").classList.remove("open"); });
$("#form").addEventListener("submit",e=>{ e.preventDefault();
  const im=+$("#fImpact").value, u=+$("#fUrg").value, max=Math.max(...data.map(i=>+i.number.slice(3)));
  data.unshift({number:"INC00"+(max+1),short:$("#fShort").value.trim(),caller:$("#fCaller").value.trim(),category:$("#fCat").value,group:$("#fAssign").value,impact:im,urgency:u,priority:PRI[im+","+u],state:"New",opened:Date.now(),resolved:null});
  save(); $("#modal").classList.remove("open"); render(); });
$("#reset").onclick=()=>{ data=seed(); save(); render(); };
$("#export").onclick=()=>{ const head=["number","short","caller","category","group","impact","urgency","priority","state","opened"];
  const csv=[head.join(",")].concat(data.map(i=>head.map(k=>`"${String(k==="opened"?new Date(i[k]).toISOString():i[k]).replace(/"/g,'""')}"`).join(","))).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="incidents.csv"; a.click(); };
const setTheme=t=>{ document.documentElement.dataset.theme=t; $("#theme").textContent=t==="dark"?"☀️":"🌙"; try{localStorage.setItem(KEY+"-theme",t)}catch(e){} };
let th0="light"; try{ th0=localStorage.getItem(KEY+"-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); }catch(e){}
setTheme(th0); $("#theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
render(); setInterval(render,30000);
</script>
</body>
</html>
